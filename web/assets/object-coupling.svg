<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">以重疊比喻物件間的相依程度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4e9c83"/></marker></defs><g font-family="Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif"><circle cx="255" cy="167" r="137" fill="#dbf0e6" stroke="#a8bc91"/><circle cx="403" cy="220" r="109" fill="#8eceb6" fill-opacity=".55" stroke="#9eb686"/><circle cx="452" cy="93" r="81" fill="#ffe7a0" fill-opacity=".72" stroke="#c1c29f"/><circle cx="727" cy="206" r="97" fill="#e8f1f2" stroke="#bccbad"/><text x="201" y="144" font-size="19" fill="#20243b" text-anchor="middle">物件 A</text><text x="441" y="227" font-size="18" fill="#20243b" text-anchor="middle">物件 C</text><text x="464" y="79" font-size="16" fill="#20243b" text-anchor="middle">物件 B</text><text x="727" y="206" font-size="18" fill="#20243b" text-anchor="middle">物件 D</text><text x="727" y="230" font-size="12" fill="#8a9b7b" text-anchor="middle">相對獨立</text><text x="341" y="219" font-size="14" fill="#577447" text-anchor="middle">高度相依</text><text x="382" y="116" font-size="11" fill="#84905f" text-anchor="middle">少量相依</text><path d="M572 44 L572 316" stroke="#b9c5ae" stroke-width="1.7" stroke-dasharray="4 7"  fill="none"/><text x="333" y="344" font-size="12" fill="#849273" text-anchor="middle">共享細節越多，變更越可能互相牽動</text></g></svg>
