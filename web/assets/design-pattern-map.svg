<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1360" role="img" aria-labelledby="title desc"><title id="title">設計模式思考示意圖：從物件出發的十二種模式關係</title><desc id="desc">建立與存取：Factory、Builder、State、Proxy。行為與流程：Template Method、Strategy、Adapter、Chain of Responsibility。組合與協作：Bridge、Decorator、Mediator、Composite。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4c9f86"/></marker></defs><g font-family="Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif"><rect width="1200" height="1360" rx="24" fill="#fffdf8"/><text x="48" y="49" font-size="13" fill="#4c9f86" text-anchor="start">DESIGN PATTERN / CONCEPT MAP</text><text x="48" y="96" font-size="34" fill="#20243b" text-anchor="start">設計模式思考示意圖</text><text x="48" y="131" font-size="17" fill="#6f777d" text-anchor="start">找出變化，並將其封裝。從物件出發，思考建立、行為與彼此的關係。</text><rect x="440" y="166" width="320" height="48" rx="8" fill="#e1f1eb" stroke="#c9dcd4"/><text x="600" y="195" font-size="13" fill="#20243b" text-anchor="middle">物件：持有狀態，透過行為完成職責</text><path d="M600 214 L220 253" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="38" y="258" width="364" height="44" rx="12" fill="#ffce57" fill-opacity=".26"/><text x="220" y="287" font-size="19" fill="#20243b" text-anchor="middle">建立與存取</text><rect x="38" y="322" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="58" y="353" font-size="21" fill="#20243b" text-anchor="start">Factory</text><text x="58" y="378" font-size="14" fill="#4c9f86" text-anchor="start">工廠方法</text><path d="M171 437 L271 415" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M171 437 L271 461" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="71" y="421" width="100" height="32" rx="8" fill="#e1f1eb" stroke="#c9dcd4"/><text x="121" y="442" font-size="13" fill="#20243b" text-anchor="middle">建立入口</text><rect x="271" y="399" width="98" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="320" y="420" font-size="13" fill="#20243b" text-anchor="middle">物件 A</text><rect x="271" y="445" width="98" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="320" y="466" font-size="13" fill="#20243b" text-anchor="middle">物件 B</text><text x="58" y="513" font-size="14" fill="#6f777d" text-anchor="start">把建立的決策，放在合適的入口。</text><rect x="38" y="550" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="58" y="581" font-size="21" fill="#20243b" text-anchor="start">Builder</text><text x="58" y="606" font-size="14" fill="#4c9f86" text-anchor="start">建造者</text><path d="M145 665 L174 665" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M253 665 L283 665" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="66" y="649" width="79" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="105.5" y="670" font-size="13" fill="#20243b" text-anchor="middle">步驟 1</text><rect x="174" y="649" width="79" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="213.5" y="670" font-size="13" fill="#20243b" text-anchor="middle">步驟 2</text><rect x="283" y="649" width="87" height="32" rx="8" fill="#fff0bf" stroke="#c9dcd4"/><text x="326.5" y="670" font-size="13" fill="#20243b" text-anchor="middle">完整物件</text><text x="58" y="741" font-size="14" fill="#6f777d" text-anchor="start">把複雜物件，拆成可組裝的步驟。</text><rect x="38" y="778" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="58" y="809" font-size="21" fill="#20243b" text-anchor="start">State</text><text x="58" y="834" font-size="14" fill="#4c9f86" text-anchor="start">狀態</text><rect x="66" y="853" width="305" height="88" rx="8" fill="#e1f1eb" stroke="#c9dcd4"/><text x="218.5" y="902" font-size="13" fill="#20243b" text-anchor="middle"></text><text x="218" y="874" font-size="12" fill="#6f777d" text-anchor="middle">物件持有目前狀態</text><path d="M151 907 L178 907" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M261 907 L289 907" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="73" y="891" width="78" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="112" y="912" font-size="13" fill="#20243b" text-anchor="middle">狀態 A</text><rect x="178" y="891" width="83" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="219.5" y="912" font-size="13" fill="#20243b" text-anchor="middle">狀態 B</text><rect x="289" y="891" width="75" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="326.5" y="912" font-size="13" fill="#20243b" text-anchor="middle">狀態 C</text><text x="58" y="969" font-size="14" fill="#6f777d" text-anchor="start">物件的行為，隨內部狀態改變。</text><rect x="38" y="1006" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="58" y="1037" font-size="21" fill="#20243b" text-anchor="start">Proxy</text><text x="58" y="1062" font-size="14" fill="#4c9f86" text-anchor="start">代理</text><path d="M146 1121 L176 1121" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M266 1121 L291 1121" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="66" y="1105" width="80" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="106" y="1126" font-size="13" fill="#20243b" text-anchor="middle">使用端</text><rect x="176" y="1105" width="90" height="32" rx="8" fill="#ffe3d9" stroke="#c9dcd4"/><text x="221" y="1126" font-size="13" fill="#20243b" text-anchor="middle">代理</text><rect x="291" y="1105" width="80" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="331" y="1126" font-size="13" fill="#20243b" text-anchor="middle">物件</text><text x="58" y="1197" font-size="14" fill="#6f777d" text-anchor="start">透過相同介面，控制物件的存取。</text><path d="M600 214 L600 253" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="418" y="258" width="364" height="44" rx="12" fill="#f38b70" fill-opacity=".26"/><text x="600" y="287" font-size="19" fill="#20243b" text-anchor="middle">行為與流程</text><rect x="418" y="322" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="438" y="353" font-size="21" fill="#20243b" text-anchor="start">Template Method</text><text x="438" y="378" font-size="14" fill="#4c9f86" text-anchor="start">樣板方法</text><path d="M530 437 L556 437" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M640 437 L666 437" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="446" y="421" width="84" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="488" y="442" font-size="13" fill="#20243b" text-anchor="middle">共同步驟</text><rect x="556" y="421" width="84" height="32" rx="8" fill="#fff0bf" stroke="#c9dcd4"/><text x="598" y="442" font-size="13" fill="#20243b" text-anchor="middle">覆寫步驟</text><rect x="666" y="421" width="84" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="708" y="442" font-size="13" fill="#20243b" text-anchor="middle">共同收尾</text><text x="438" y="513" font-size="14" fill="#6f777d" text-anchor="start">固定流程骨架，覆寫變動步驟。</text><rect x="418" y="550" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="438" y="581" font-size="21" fill="#20243b" text-anchor="start">Strategy</text><text x="438" y="606" font-size="14" fill="#4c9f86" text-anchor="start">策略</text><path d="M551 665 L651 643" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M551 665 L651 689" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="451" y="649" width="100" height="32" rx="8" fill="#e1f1eb" stroke="#c9dcd4"/><text x="501" y="670" font-size="13" fill="#20243b" text-anchor="middle">策略介面</text><rect x="651" y="627" width="98" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="700" y="648" font-size="13" fill="#20243b" text-anchor="middle">策略 A</text><rect x="651" y="673" width="98" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="700" y="694" font-size="13" fill="#20243b" text-anchor="middle">策略 B</text><text x="438" y="741" font-size="14" fill="#6f777d" text-anchor="start">用共同介面，替換整套演算法。</text><rect x="418" y="778" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="438" y="809" font-size="21" fill="#20243b" text-anchor="start">Adapter</text><text x="438" y="834" font-size="14" fill="#4c9f86" text-anchor="start">轉接器</text><path d="M529 893 L555 893" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M641 893 L667 893" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="446" y="877" width="83" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="487.5" y="898" font-size="13" fill="#20243b" text-anchor="middle">介面 A</text><rect x="555" y="877" width="86" height="32" rx="8" fill="#fff0bf" stroke="#c9dcd4"/><text x="598" y="898" font-size="13" fill="#20243b" text-anchor="middle">轉接器</text><rect x="667" y="877" width="83" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="708.5" y="898" font-size="13" fill="#20243b" text-anchor="middle">介面 B</text><text x="438" y="969" font-size="14" fill="#6f777d" text-anchor="start">轉換不相容的介面，接上既有能力。</text><rect x="418" y="1006" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="438" y="1037" font-size="18" fill="#20243b" text-anchor="start">Chain of Responsibility</text><text x="438" y="1062" font-size="14" fill="#4c9f86" text-anchor="start">責任鏈</text><path d="M530 1121 L556 1121" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M640 1121 L666 1121" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="446" y="1105" width="84" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="488" y="1126" font-size="13" fill="#20243b" text-anchor="middle">處理者 1</text><rect x="556" y="1105" width="84" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="598" y="1126" font-size="13" fill="#20243b" text-anchor="middle">處理者 2</text><rect x="666" y="1105" width="84" height="32" rx="8" fill="#fff0bf" stroke="#c9dcd4"/><text x="708" y="1126" font-size="13" fill="#20243b" text-anchor="middle">處理者 3</text><text x="438" y="1197" font-size="14" fill="#6f777d" text-anchor="start">沿處理者傳遞，直到有人接手。</text><path d="M600 214 L980 253" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="798" y="258" width="364" height="44" rx="12" fill="#4c9f86" fill-opacity=".26"/><text x="980" y="287" font-size="19" fill="#20243b" text-anchor="middle">組合與協作</text><rect x="798" y="322" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="818" y="353" font-size="21" fill="#20243b" text-anchor="start">Bridge</text><text x="818" y="378" font-size="14" fill="#4c9f86" text-anchor="start">橋接</text><path d="M939 437 L1019 437" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="826" y="421" width="113" height="32" rx="8" fill="#e1f1eb" stroke="#c9dcd4"/><text x="882.5" y="442" font-size="13" fill="#20243b" text-anchor="middle">抽象維度</text><rect x="1019" y="421" width="112" height="32" rx="8" fill="#fff0bf" stroke="#c9dcd4"/><text x="1075" y="442" font-size="13" fill="#20243b" text-anchor="middle">實作維度</text><text x="883" y="479" font-size="11" fill="#6f777d" text-anchor="middle">可獨立擴展</text><text x="1075" y="479" font-size="11" fill="#6f777d" text-anchor="middle">可獨立擴展</text><text x="818" y="513" font-size="14" fill="#6f777d" text-anchor="start">抽象與實作，沿兩個維度獨立擴展。</text><rect x="798" y="550" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="818" y="581" font-size="21" fill="#20243b" text-anchor="start">Decorator</text><text x="818" y="606" font-size="14" fill="#4c9f86" text-anchor="start">裝飾者</text><rect x="826" y="623" width="305" height="94" rx="8" fill="#ffe3d9" stroke="#c9dcd4"/><text x="978.5" y="675" font-size="13" fill="#20243b" text-anchor="middle"></text><text x="838" y="641" font-size="11" fill="#6f777d" text-anchor="start">外層裝飾</text><rect x="861" y="649" width="235" height="61" rx="8" fill="#fff0bf" stroke="#c9dcd4"/><text x="978.5" y="684.5" font-size="13" fill="#20243b" text-anchor="middle"></text><text x="873" y="666" font-size="11" fill="#6f777d" text-anchor="start">內層裝飾</text><rect x="901" y="674" width="155" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="978.5" y="695" font-size="13" fill="#20243b" text-anchor="middle">原始物件</text><text x="818" y="741" font-size="14" fill="#6f777d" text-anchor="start">逐層包裝，為物件疊加能力。</text><rect x="798" y="778" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="818" y="809" font-size="21" fill="#20243b" text-anchor="start">Mediator</text><text x="818" y="834" font-size="14" fill="#4c9f86" text-anchor="start">中介者</text><path d="M918 869 L941 891" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M918 924 L941 901" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M1019 891 L1041 869" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M1019 901 L1041 924" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="826" y="854" width="92" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="872" y="875" font-size="13" fill="#20243b" text-anchor="middle">物件 A</text><rect x="826" y="909" width="92" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="872" y="930" font-size="13" fill="#20243b" text-anchor="middle">物件 B</text><rect x="941" y="881" width="78" height="32" rx="8" fill="#e1f1eb" stroke="#c9dcd4"/><text x="980" y="902" font-size="13" fill="#20243b" text-anchor="middle">中介者</text><rect x="1041" y="854" width="90" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="1086" y="875" font-size="13" fill="#20243b" text-anchor="middle">物件 C</text><rect x="1041" y="909" width="90" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="1086" y="930" font-size="13" fill="#20243b" text-anchor="middle">物件 D</text><text x="818" y="969" font-size="14" fill="#6f777d" text-anchor="start">集中協調互動，減少彼此直接相依。</text><rect x="798" y="1006" width="364" height="212" rx="15" fill="#fff" stroke="#e7e4dc"/><text x="818" y="1037" font-size="21" fill="#20243b" text-anchor="start">Composite</text><text x="818" y="1062" font-size="14" fill="#4c9f86" text-anchor="start">組合</text><path d="M978 1105 L892 1144" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><path d="M978 1105 L1068 1144" stroke="#4c9f86" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/><rect x="928" y="1077" width="100" height="32" rx="8" fill="#e1f1eb" stroke="#c9dcd4"/><text x="978" y="1098" font-size="13" fill="#20243b" text-anchor="middle">群組</text><rect x="841" y="1144" width="105" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="893.5" y="1165" font-size="13" fill="#20243b" text-anchor="middle">子群組</text><rect x="1016" y="1144" width="110" height="32" rx="8" fill="#fff" stroke="#c9dcd4"/><text x="1071" y="1165" font-size="13" fill="#20243b" text-anchor="middle">單一物件</text><text x="818" y="1197" font-size="14" fill="#6f777d" text-anchor="start">以共同介面，操作群組與單一物件。</text><text x="48" y="1275" font-size="16" fill="#20243b" text-anchor="start">讀圖方式</text><text x="48" y="1303" font-size="15" fill="#6f777d" text-anchor="start">箭頭表示建立、委派或流程方向；包覆表示組合。圖例為概念簡化，不是 UML 類別圖。</text><text x="48" y="1330" font-size="15" fill="#6f777d" text-anchor="start">以上是思考視角，不是 GoF 分類，也不代表每個系統都需要套用全部模式。</text></g></svg>