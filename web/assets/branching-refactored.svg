<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">在入口選擇策略，讓各策略封裝自己的行為</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4e9c83"/></marker></defs><g font-family="Noto Sans TC,Microsoft JhengHei,system-ui,sans-serif"><text x="152" y="53" font-size="13" fill="#7b8c6d" text-anchor="middle">把選擇集中在入口</text><text x="622" y="53" font-size="13" fill="#7b8c6d" text-anchor="middle">把變化封裝在實作</text><path d="M255 180 L370 180" stroke="#4e9c83" stroke-width="1.7"  marker-end="url(#arrow)" fill="none"/><path d="M490 180 L600 95" stroke="#4e9c83" stroke-width="1.7"  marker-end="url(#arrow)" fill="none"/><path d="M490 180 L600 180" stroke="#4e9c83" stroke-width="1.7"  marker-end="url(#arrow)" fill="none"/><path d="M490 180 L600 265" stroke="#4e9c83" stroke-width="1.7"  marker-end="url(#arrow)" fill="none"/><rect x="65" y="146" width="190" height="68" rx="12" fill="#dff1e9" stroke="#bddbd0"/><text x="160" y="177" font-size="15" fill="#20243b" text-anchor="middle">處理請求</text><text x="160" y="198" font-size="11" fill="#819571" text-anchor="middle">選擇適合的行為</text><rect x="370" y="146" width="120" height="68" rx="12" fill="#fff0c6" stroke="#bddbd0"/><text x="430" y="177" font-size="15" fill="#20243b" text-anchor="middle">策略介面</text><text x="430" y="198" font-size="11" fill="#819571" text-anchor="middle">共同契約</text><rect x="600" y="64" width="230" height="62" rx="12" fill="#fff" stroke="#bddbd0"/><text x="715" y="92" font-size="15" fill="#20243b" text-anchor="middle">策略 A</text><text x="715" y="113" font-size="11" fill="#819571" text-anchor="middle">各自完成自己的流程</text><rect x="600" y="149" width="230" height="62" rx="12" fill="#fff" stroke="#bddbd0"/><text x="715" y="177" font-size="15" fill="#20243b" text-anchor="middle">策略 B</text><text x="715" y="198" font-size="11" fill="#819571" text-anchor="middle">各自完成自己的流程</text><rect x="600" y="234" width="230" height="62" rx="12" fill="#fff" stroke="#bddbd0"/><text x="715" y="262" font-size="15" fill="#20243b" text-anchor="middle">策略 C</text><text x="715" y="283" font-size="11" fill="#819571" text-anchor="middle">各自完成自己的流程</text></g></svg>
